<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sổ Thu Chi</title>
    <link rel="stylesheet" href="style.css?v=3201757" />
</head>
<body>

    <!-- ================= TOAST NOTIFICATION ================= -->
    <div id="toast" class="toast"></div>

    <!-- ================= LOADING SPINNER ================= -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
    </div>

    <!-- ================= HEADER ================= -->
    <div class="header">
        <div class="header-top">
            <h1>Sổ Thu Chi</h1>
            <button class="btn-header-toggle" id="header-toggle-btn">▼</button>
        </div>
        <div class="header-notify" id="header-notify" style="margin-top:8px;font-size:15px;color:#007bff;font-weight:bold"></div>
        <div class="header-summary">
            <div class="balance-tag">Số dư LT: 0</div>
        </div>
        <div class="header-details collapsed" id="header-details">
            <!-- Dynamic content from JS -->
        </div>
        <div class="version">v3.2.1757</div>
    </div>

    <!-- ================= TAB CONTENT ================= -->
    <div class="tab-content">

        <!-- TAB: CHI -->
        <div id="tab-chi" class="tab-panel active">
            <div class="card card-chi">
                <div class="card-header">
                    <div class="card-title red-text">CHI</div>
                    <button class="btn-settings-icon" id="chi-settings-btn">⚙️</button>
                </div>

                <div class="input-group-block ig-red">
                    <div class="date-row">
                        <button class="btn-square" id="chi-date-prev">&lt;</button>
                        <div class="date-display-wrapper">
                            <button class="btn-date-display" id="chi-date-display"></button>
                            <input type="date" class="date-input-overlay" id="chi-date-input">
                        </div>
                        <button class="btn-square" id="chi-date-next">&gt;</button>
                    </div>
                </div>

                <div class="input-group-block ig-indigo">
                    <div class="calc-row">
                        <input class="calc-input" id="chi-input" type="number" step="0.000001" placeholder="VNĐ">
                        <button class="btn-square btn-blue" id="chi-add">+</button>
                        <button class="btn-square btn-delete" id="chi-clear">↻</button>
                    </div>
                    <div class="chi-preview" id="chi-preview"></div>
                    <div class="stack-display" id="chi-stack">Tổng: 0</div>
                </div>

                <div class="input-group-block ig-yellow">
                    <div class="chip-grid" id="chi-chips"></div>
                    <select class="input-std" id="chi-desc-dropdown">
                        <option value="">-- Mô tả khác --</option>
                    </select>
                </div>

                <div class="input-group-block ig-teal">
                    <select class="input-std" id="chi-source">
                        <option value="">-- Nguồn tiền --</option>
                    </select>
                </div>

                <button class="btn-submit btn-red" id="chi-submit" disabled>
                    Thêm chi
                </button>
            </div>
        </div>

        <!-- TAB: THU -->
        <div id="tab-thu" class="tab-panel">
            <div class="card card-thu">
                <div class="card-header">
                    <div class="card-title green-text">THU</div>
                    <button class="btn-settings-icon" id="thu-settings-btn">⚙️</button>
                </div>

                <div class="input-group-block ig-purple">
                    <div class="date-row">
                        <button class="btn-square" id="thu-date-prev">&lt;</button>
                        <div class="date-display-wrapper">
                            <button class="btn-date-display" id="thu-date-display"></button>
                            <input type="date" class="date-input-overlay" id="thu-date-input">
                        </div>
                        <button class="btn-square" id="thu-date-next">&gt;</button>
                    </div>
                </div>

                <div class="input-group-block ig-blue">
                    <div class="calc-row">
                        <input class="calc-input" id="thu-input" type="number" step="0.01" placeholder="VNĐ">
                        <button class="btn-square btn-blue" id="thu-add">+</button>
                        <button class="btn-square btn-delete" id="thu-clear">↻</button>
                    </div>
                    <div class="stack-display" id="thu-display">Tổng: 0</div>
                </div>

                <div class="input-group-block ig-orange">
                    <div class="chip-grid" id="thu-chips"></div>
                    <input class="input-std" id="thu-desc-input" placeholder="Mô tả thu">
                    <select class="input-std" id="thu-loai">
                        <option value="">-- Loại thu --</option>
                    </select>
                </div>

                <div class="input-group-block ig-green">
                    <select class="input-std" id="thu-source">
                        <option value="">-- Nguồn tiền --</option>
                    </select>
                </div>

                <button class="btn-submit btn-green" id="thu-submit" disabled>
                    Thêm thu
                </button>
            </div>
        </div>

        <!-- TAB: TỔNG KẾT -->
        <div id="tab-tk" class="tab-panel">

            <!-- CHI chưa tổng kết -->
            <div id="tk-chi-section" style="display:none;">
                <div class="card card-chi">
                    <div class="card-header">
                        <div class="card-title red-text">CHI</div>
                        <span id="tk-chi-count" class="tk-section-count"></span>
                    </div>
                    <div id="tk-chi-list"></div>
                </div>
            </div>

            <!-- THU chưa tổng kết -->
            <div id="tk-thu-section" style="display:none;">
                <div class="card card-thu">
                    <div class="card-header">
                        <div class="card-title green-text">THU</div>
                        <span id="tk-thu-count" class="tk-section-count"></span>
                    </div>
                    <div id="tk-thu-list"></div>
                </div>
            </div>

            <!-- Form tổng kết -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title blue-text">TỔNG KẾT</div>
                </div>

                <button class="btn-submit btn-blue" id="tk-start">Làm tổng kết</button>
                <button class="btn-submit btn-blue" id="tk-refresh" style="display:none;">🔄 Cập nhật</button>

                <div id="tk-form" style="display: none;">
                    <div class="tk-period">Nhập số dư thực tế:</div>
                    <div id="tk-inputs"></div>
                    <button class="btn-submit btn-purple" id="tk-remember">Ghi nhớ số dư</button>
                    <button class="btn-submit btn-orange" id="tk-check">Kiểm tra</button>
                    <div id="tk-result" style="display: none;"></div>
                    <button class="btn-submit btn-green" id="tk-confirm" style="display: none;">Xác nhận tổng kết</button>
                </div>
            </div>
        </div>

    </div>

    <!-- ================= TAB BAR ================= -->
    <nav class="tab-bar">
        <button class="tab-btn tab-btn-chi active" data-tab="chi">
            <span class="tab-icon">💸</span>
            <span class="tab-label">CHI</span>
        </button>
        <button class="tab-btn tab-btn-thu" data-tab="thu">
            <span class="tab-icon">💰</span>
            <span class="tab-label">THU</span>
        </button>
        <button class="tab-btn tab-btn-tk" data-tab="tk">
            <span class="tab-icon">📊</span>
            <span class="tab-label">TỔNG KẾT</span>
        </button>
    </nav>

    <!-- ================= MODAL POPUP FOR SETTINGS ================= -->
    <!-- CHI Settings Modal -->
    <div id="chi-settings-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ Cấu hình CHI</h3>
                <div class="modal-header-actions">
                    <button class="btn-reset-settings" id="chi-modal-reset" title="Reset về mặc định">↻</button>
                    <button class="modal-close" id="chi-modal-close">&times;</button>
                </div>
            </div>

            <div class="modal-body">
                <div class="modal-section">
                    <h4>📋 Chọn 8 mô tả hiển thị nhanh</h4>

                    <button type="button" class="dropdown-toggle" id="chi-dropdown-toggle">
                        <span class="dropdown-label">Chọn mô tả (<span id="chi-dropdown-count">0</span>/8)</span>
                        <span class="dropdown-arrow">▼</span>
                    </button>

                    <div class="dropdown-content" id="chi-dropdown-content">
                        <div class="checkbox-list" id="chi-modal-checkbox-list">
                            <!-- Dynamically populated -->
                        </div>
                    </div>
                </div>

                <div class="modal-section">
                    <h4>➕ Thêm mô tả chi mới</h4>
                    <input type="text" id="chi-modal-new-name" class="input-std" placeholder="Tên mô tả *">
                    <select id="chi-modal-new-phanloai" class="input-std">
                        <option value="">-- Chọn phân loại *--</option>
                    </select>
                    <input type="text" id="chi-modal-new-note" class="input-std" placeholder="Ghi chú (optional)">
                    <button id="chi-modal-add-btn" class="btn-submit btn-blue" disabled>Thêm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- THU Settings Modal -->
    <div id="thu-settings-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ Cấu hình THU</h3>
                <div class="modal-header-actions">
                    <button class="btn-reset-settings" id="thu-modal-reset" title="Reset về mặc định">↻</button>
                    <button class="modal-close" id="thu-modal-close">&times;</button>
                </div>
            </div>

            <div class="modal-body">
                <div class="modal-section">
                    <h4>📋 Chọn 8 mô tả hiển thị nhanh</h4>

                    <button type="button" class="dropdown-toggle" id="thu-dropdown-toggle">
                        <span class="dropdown-label">Chọn mô tả (<span id="thu-dropdown-count">0</span>/8)</span>
                        <span class="dropdown-arrow">▼</span>
                    </button>

                    <div class="dropdown-content" id="thu-dropdown-content">
                        <div class="checkbox-list" id="thu-modal-checkbox-list">
                            <!-- Dynamically populated from Thu_2026 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="cache.js?v=3201757"></script>
    <script src="app.js?v=3201757"></script>
</body>
</html>
